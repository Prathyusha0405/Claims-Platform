# The whole platform in containers: a single-node Kafka broker, the three Spring Boot services and the Angular app behind nginx.
#
#   docker compose up --build        then open http://localhost:4200
#   docker compose down              stop and remove the containers
#
# Settings you can override with environment variables (or a .env file next to this one):
#   JWT_SECRET        the signing key all three services share; the default below is for local use only
#   EVENTS_PUBLISHER  kafka (default here) or local; local makes claim-service handle events in-process, as it does outside Docker
#
# The databases are in-memory H2, so data is reset whenever a service container is recreated.

name: chubb-claims

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      # One node that is both broker and controller (KRaft mode, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    image: chubb-claims/auth-service
    ports:
      - "8084:8084"
    environment:
      JWT_SECRET: ${JWT_SECRET:-chubb-claims-dev-only-secret-key-change-me-0123456789}
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]

  claim-service:
    build:
      context: ./backend
      args:
        SERVICE: claim-service
    image: chubb-claims/claim-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:-chubb-claims-dev-only-secret-key-change-me-0123456789}
      EVENTS_PUBLISHER: ${EVENTS_PUBLISHER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]

  assessment-service:
    build:
      context: ./backend
      args:
        SERVICE: assessment-service
    image: chubb-claims/assessment-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:-chubb-claims-dev-only-secret-key-change-me-0123456789}
      CLAIM_SERVICE_URL: http://claim-service:8082
    depends_on:
      claim-service:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]

  frontend:
    build:
      context: ./frontend/claims-portal
    image: chubb-claims/frontend
    ports:
      - "4200:80"
    depends_on:
      auth-service:
        condition: service_healthy
      claim-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
