server:
  port: 8083

spring:
  application:
    name: assessment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:assessmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 = schema, V2 = demo data (150 assessments, 200 notes). Start empty with FLYWAY_TARGET=1.
    target: ${FLYWAY_TARGET:latest}
  data:
    web:
      pageable:
        # Page indexes are zero-based; clients cannot request more than max-page-size rows at once.
        # (The default page size is set per endpoint via @PageableDefault.)
        max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  # Responses are documented explicitly on each operation; do not inject advice-derived ones into all of them.
  override-with-generic-response: false

app:
  jwt:
    # Development-only default (>= 256 bits for HS256). Override with the JWT_SECRET environment variable.
    # Must equal auth-service's secret: this service validates the tokens auth-service issues.
    secret: ${JWT_SECRET:chubb-claims-dev-only-secret-key-change-me-0123456789}
  claim-service:
    # Claim-service owns the claims; every claims staff action and dashboard figure is fetched from it.
    base-url: ${CLAIM_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  dashboard:
    # Claims are in their own market's currency. The dashboards add them up in this one, using fixed, indicative rates
    # (units of each currency per 1 unit of the reporting currency). They are not live market rates; keep them in step
    # with the rates the claim-service seed data was converted at, or the seed's documented USD figures will drift.
    reporting-currency: USD
    rates:
      AUD: 1.50
      HKD: 7.80
      JPY: 150
      MYR: 4.50
      NZD: 1.65
      SGD: 1.35

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoints are exposed; nothing else of Actuator is reachable.
        include: health
  endpoint:
    health:
      probes:
        enabled: true      # adds /actuator/health/liveness and /actuator/health/readiness
      show-details: never  # callers without a token see the status only
      group:
        # Not ready while claim-service cannot be reached. Liveness never depends on it, so a claim-service outage does not
        # get this service restarted.
        readiness:
          include: readinessState,claimService

logging:
  pattern:
    # Every log line carries the id of the request that caused it (see RequestIdFilter); "-" outside a request.
    level: "%5p [%X{requestId:--}]"
