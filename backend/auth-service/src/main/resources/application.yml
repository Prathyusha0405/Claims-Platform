server:
  port: 8084

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 = schema, V2 = demo data (26 users). Start with an empty platform by setting FLYWAY_TARGET=1.
    target: ${FLYWAY_TARGET:latest}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Development-only default (>= 256 bits for HS256). Override with the JWT_SECRET environment variable.
    # All three services must share the same secret so tokens issued by auth-service validate elsewhere.
    secret: ${JWT_SECRET:chubb-claims-dev-only-secret-key-change-me-0123456789}
    expiration-ms: 3600000
  seed:
    # Development only: creates a demo CLAIMS_STAFF (staff@chubb.com) and MANAGER (manager@chubb.com) at startup.
    # Public registration can only create CLAIMANTs, so this is how staff accounts exist locally.
    demo-users: true
