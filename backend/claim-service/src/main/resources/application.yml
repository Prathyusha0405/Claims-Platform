server:
  port: 8082

spring:
  application:
    name: claim-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:claimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 = schema, V2 = demo data (250 claims, 500 history rows, 200 notifications). Start empty with FLYWAY_TARGET=1.
    target: ${FLYWAY_TARGET:latest}
  data:
    web:
      pageable:
        # Page indexes are zero-based; clients cannot request more than max-page-size rows at once.
        # (The default page size is set per endpoint in ClaimController via @PageableDefault.)
        max-page-size: 100
  kafka:
    # Only used when app.events.publisher=kafka; with the default (local) the service never contacts a broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all          # with idempotence (the client default), a retried send cannot create a duplicate
      properties:
        # An unreachable broker must fail a send within seconds, not the client's defaults of one and two minutes.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: claim-service
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  # Responses are documented explicitly on each operation; do not inject advice-derived ones into all of them.
  override-with-generic-response: false

app:
  jwt:
    # Development-only default (>= 256 bits for HS256). Override with the JWT_SECRET environment variable.
    # Must equal auth-service's secret: this service validates the tokens auth-service issues.
    secret: ${JWT_SECRET:chubb-claims-dev-only-secret-key-change-me-0123456789}
  events:
    # local = every claim event is handled in-process, in the claim's own transaction (audit row + notifications).
    # kafka = the event is saved to an outbox table in that transaction, relayed to Kafka, and recorded by the consumer.
    publisher: ${EVENTS_PUBLISHER:local}
    kafka:
      topic: claim-events
      partitions: 3
      replication-factor: 1
      batch-size: 100
      relay-delay-ms: 500     # pause between outbox runs
      send-timeout: 5s        # wait for Kafka to acknowledge one event
      retry-interval: 1s      # consumer: pause before retrying an event that could not be recorded
      max-retries: 3          # consumer: then the event is parked on claim-events.DLT

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoints are exposed; nothing else of Actuator is reachable.
        include: health
  endpoint:
    health:
      probes:
        enabled: true      # adds /actuator/health/liveness and /actuator/health/readiness
      show-details: never  # callers without a token see the status only

logging:
  pattern:
    # Every log line carries the id of the request that caused it (see RequestIdFilter); "-" outside a request.
    level: "%5p [%X{requestId:--}]"
