# Serves the Angular app and forwards the API calls the way proxy.conf.json does for `ng serve`: the browser only ever talks
# to this one origin, so the services need no CORS configuration.
#
# The service addresses are variables, with Docker's built-in DNS (127.0.0.11) to look them up, so nginx starts even if a
# service is not up yet (it answers 502 until it is) instead of refusing to start.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One id per request, passed to the services (they accept it as X-Request-Id) so a call can be followed in their logs.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # auth-service
    location /api/auth/ {
        set $auth_service http://auth-service:8084;
        proxy_pass $auth_service;
    }
    location /api/users/ {
        set $auth_service http://auth-service:8084;
        proxy_pass $auth_service;
    }

    # claim-service
    location /api/claims {
        set $claim_service http://claim-service:8082;
        proxy_pass $claim_service;
    }
    location /api/notifications {
        set $claim_service http://claim-service:8082;
        proxy_pass $claim_service;
    }

    # assessment-service
    location /api/staff/ {
        set $assessment_service http://assessment-service:8083;
        proxy_pass $assessment_service;
    }
    location /api/dashboard/ {
        set $assessment_service http://assessment-service:8083;
        proxy_pass $assessment_service;
    }

    # An unknown /api path is an error, not the Angular app.
    location /api/ {
        return 404;
    }

    # The app's own routes (/staff/work-queue and so on) are handled in the browser: serve index.html for them, but never
    # let a browser keep an old copy of it, or a new release would not be picked up.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
