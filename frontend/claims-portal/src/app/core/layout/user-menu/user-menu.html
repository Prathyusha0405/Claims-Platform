@if (user(); as current) {
  <button mat-button class="user-menu__trigger" [matMenuTriggerFor]="menu" aria-label="Account menu">
    <mat-icon aria-hidden="true">account_circle</mat-icon>
    <span class="user-menu__name">{{ current.fullName }}</span>
    <mat-icon iconPositionEnd aria-hidden="true">arrow_drop_down</mat-icon>
  </button>

  <mat-menu #menu="matMenu" xPosition="before">
    <div class="user-menu__summary">
      <span class="user-menu__summary-name">{{ current.fullName }}</span>
      <span class="user-menu__summary-email">{{ current.email }}</span>
      <span class="user-menu__summary-role">{{ roleLabel() }}</span>
    </div>
    <button mat-menu-item (click)="signOut()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
}
