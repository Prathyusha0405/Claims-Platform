<form (submit)="$event.preventDefault(); confirm()">
  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    @if (data.description) {
      <p class="prompt__description">{{ data.description }}</p>
    }
    <mat-form-field class="prompt__field">
      <mat-label>{{ data.label }}</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="4"
        cdkAutosizeMaxRows="10"
        [formControl]="text"
      ></textarea>
      <mat-hint align="end">{{ text.value.length }} / {{ data.maxLength }}</mat-hint>
      <mat-error>{{ error() }}</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <!-- Bound to undefined on purpose: a bare mat-dialog-close attribute closes with '', which promptForText cannot tell apart
         from a confirmation with nothing typed, so Cancel would go on to approve (or settle) the claim. -->
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button type="submit" [class.prompt__danger]="data.destructive">
      {{ data.confirmLabel }}
    </button>
  </mat-dialog-actions>
</form>
